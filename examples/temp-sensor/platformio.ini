; NightMare Network -- temp-sensor example.
; A device with one sensor, done the way the protocol docs describe: a DS18B20
; sampled on its own task, readings published as one JSON object on
; <Device>/sensors, and the `sensors` declaration the backend reads.
;
;   cp include/creds.example.h include/creds.h   # then fill it in
;   pio run -e esp32c3-supermini -t upload -t monitor

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board_build.partitions = min_spiffs.csv
build_flags =
	-I "${platformio.include_dir}"
lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git
	bblanchon/ArduinoJson@^6.21.3
	; DallasTemperature pulls OneWire in on its own; OneWire is pinned because
	; releases before 2.3.8 do not build for the C3's RISC-V core.
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0

[env:esp32c3-supermini]
board = nologo_esp32c3_super_mini
build_flags =
	${env.build_flags}
	-D ESP32_C3
	-D BOARD_C3_V1

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
monitor_rts = 0
monitor_dtr = 0
build_flags =
	${env.build_flags}
	-D BOARD_ESP32_V1
