; NightMare Network basic example. Build against this checkout.
[platformio]
default_envs = esp32c3-supermini, esp32doit-devkit-v1

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board_build.partitions = min_spiffs.csv
lib_deps =
    symlink://../..
    bblanchon/ArduinoJson@^6.21.3

[env:esp32c3-supermini]
board = nologo_esp32c3_super_mini

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
monitor_rts = 0
monitor_dtr = 0

; Explicit build profile used to verify the Resource/Network core without the
; standard settings, console, telemetry, WiFi, MQTT and OTA convenience layers.
[env:esp32c3-minimal]
extends = env:esp32c3-supermini
build_flags =
    -DNIGHTMARE_ENABLE_SETTINGS=0
    -DNIGHTMARE_ENABLE_CONSOLE=0
    -DNIGHTMARE_ENABLE_TELEMETRY=0
    -DNIGHTMARE_ENABLE_OTA=0
    -DNIGHTMARE_ENABLE_WIFI=0
    -DNIGHTMARE_ENABLE_MQTT=0
