; NightMare Network -- basic example.
; A device that joins WiFi and MQTT, announces itself, answers the built-in
; commands plus one of its own, and publishes telemetry. Nothing else.
;
;   cp include/creds.example.h include/creds.h   # then fill it in
;   pio run -e esp32c3-supermini -t upload -t monitor

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder
; Arduino core 3.x is required: the MQTT module uses the nested
; esp_mqtt_client_config_t that only exists from ESP-IDF 5. The registry's
; "espressif32" stops at core 2.x and will not compile.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board_build.partitions = min_spiffs.csv
; Required. Libraries are compiled with their own include path and would not
; see include/creds.h and include/Modules.config.h without it.
build_flags =
	-I "${platformio.include_dir}"
lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git
	bblanchon/ArduinoJson@^6.21.3

[env:esp32c3-supermini]
board = nologo_esp32c3_super_mini
; NightMareNetwork's own switch: routes the serial command resolver to the
; C3's native-USB HWCDC console instead of HardwareSerial.
build_flags =
	${env.build_flags}
	-D ESP32_C3

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
; USB-UART bridge: holding RTS/DTR low stops the adapter resetting the board
; every time the monitor connects.
monitor_rts = 0
monitor_dtr = 0
