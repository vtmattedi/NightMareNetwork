[env:idf_core]
platform = espressif32
board = esp32doit-devkit-v1
framework = espidf
board_build.partitions = min_spiffs.csv
lib_deps = symlink://../..
build_flags =
    -Iinclude
    -DARDUINOJSON_ENABLE_STD_STRING=1

[env:idf_full]
extends = env:idf_core
build_flags =
    ${env:idf_core.build_flags}
    -DNM_SMOKE_FULL=1

[env:idf_servers]
extends = env:idf_full
build_flags =
    ${env:idf_full.build_flags}
    -DNM_ENABLE_HTTP=1
    -DNM_ENABLE_WEBSOCKET=1

[env:idf_espnow]
extends = env:idf_full
build_flags =
    ${env:idf_full.build_flags}
    -DNM_NETWORK_ESPNOW=1

