<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: Sansation; src: url("src/assets/branding/Sansation_Regular.ttf"); }
      @font-face { font-family: Sansation; src: url("src/assets/branding/Sansation_Bold.ttf"); font-weight: 700; }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body {
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 92px;
        overflow: hidden;
        color: #f1f0ef;
        background: radial-gradient(circle at 18% 50%, #281b13, #0e0e10 62%);
        font-family: Sansation, sans-serif;
      }
      img { width: 335px; height: 335px; flex: none; }
      h1 { margin: 0; font-size: 73px; line-height: 1.05; letter-spacing: -2px; }
      h1 span { color: #fc9545; }
      p { margin: 22px 0 0; color: #bfc0c2; font-size: 29px; line-height: 1.28; }
    </style>
  </head>
  <body>
    <img src="nightmare_logo.svg" alt="" />
    <div>
      <h1>NightMare<br /><span>Network</span></h1>
      <p>Build the device.<br />Share the language.</p>
    </div>
  </body>
</html>
