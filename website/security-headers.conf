# Security headers, included at server level and again in every location that
# sets its own add_header: nginx drops inherited add_header directives in any
# block that declares one, so a bare server-level list silently disappears.
# `always` keeps them on 404 and redirect responses too.
#
# The page's script/style policy is a per-page <meta> written at build time
# (website/build/postbuild.ts), because the inline script hashes differ per
# page. frame-ancestors cannot be set from a <meta>, so it lives here.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
