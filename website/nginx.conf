# NightMare Network -- website + reverse proxy for the MCP endpoint.
# Serves the static SSG output at / and proxies /mcp to the mcp service over the
# compose network. Plain HTTP only: Stackport's nginx terminates TLS in front.

server {
    listen 80;
    listen [::]:80;   # "localhost" resolves to ::1 first in Alpine; without this a same-container probe is refused
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Stackport health check target. Never depends on the MCP container.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # MCP over Streamable HTTP. POST carries JSON-RPC; GET opens an SSE stream;
    # DELETE ends a session. Buffering must be off or SSE never flushes, and
    # the read timeout has to outlive a quiet stream.
    # Exact match only: /mcp is the endpoint, /mcp/anything is not, and the
    # website's own MCP guide lives at /docs/mcp.
    location = /mcp {
        proxy_pass http://mcp:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Hashed assets: cache hard. Everything else revalidates.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SSG emits one index.html per route (docs/mcp/index.html). Fall back to
    # the root shell so client-side navigation to an un-prerendered path
    # still loads the app rather than a 404 page.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
